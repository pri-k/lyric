<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>

</head>
<body>
    <div class="home">
        <img class="img1" src="/home.png">
        <a href="mailto:aatmashrisanyal@gmail.com"><button class="btn">Contact</button></a>
    </div>
    <img class="img1" src="/Portfolio pages/PORTFOLIO-02.png">
    <div class="holder">  
        <div class="spinner">
          <div class="panel a" onclick="window.open('/agni.html','_blank')" style="cursor:pointer;"></div>
          <div class="panel b" onclick="window.open('/bike.html','_blank')" style="cursor:pointer;"></div>
          <div class="panel c" onclick="window.open('/can.html','_blank')" style="cursor:pointer;"></div>
          <div class="panel d" onclick="window.open('/cat.html','_blank')" style="cursor:pointer;"></div>
          <div class="panel e" onclick="window.open('/dadi.html','_blank')" style="cursor:pointer;"></div>
          <div class="panel f" onclick="window.open('/grocery.html','_blank')" style="cursor:pointer;"></div>
          <div class="panel g" onclick="window.open('/med.html','_blank')" style="cursor:pointer;"></div>
          <div class="panel h" onclick="window.open('/wealth.html','_blank')" style="cursor:pointer;"></div>
          <div class="panel i" onclick="window.open('/cosmo.html','_blank')" style="cursor:pointer;"></div>
          <div class="fade"></div>
        </div>
      </div>
      <div class="pagination">
        <button type="button" id="prev">&#8592;</button>
        <button type="button" id="next">&#8594;</button>
      </div>
      <img class="img1" src="/Portfolio pages/PORTFOLIO-03.png">
      <script>
        var ang = 0;
        $("#prev").click(function(){
            ang = ang + 40;
        $("*").css("--ang", ang);
        });

        $("#next").click(function(){
            ang = ang - 40;
        $("*").css("--ang", ang);
        });
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@900&display=swap');

        home{
            position: relative;
        }
        .home .btn{
            position: absolute;
            top: 5%;
            left: 95%;
            transform: translate(-50%, -50%);
            -ms-transform: translate(-50%, -50%);
            background-color: #fff;
            color: black;
            font-size: 18px;
            font-weight: bold;
            padding: 12px 24px;
            cursor: pointer;
            border-radius: 5px;
        }
        body {
        background: black;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        }

        .spinner {
        transform-style: preserve-3d;
        /* //background: #fff3; */
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        transform: rotateY(calc(var(--ang) * 1deg)) translateY(-12px);
        transition: all .5s ease-in-out;
        /* //animation: spin 10s linear infinite;
        //transform: rotateX(10deg) rotateY(-98deg); */
        }

        .holder {
        /* //background: #fff2; */
        margin-top: 300px;
        margin-bottom: 200px;
        width: 1vi;
        height:auto;
        display: flex;
            justify-content: center;
            align-items: center;
        perspective: 700px;
        perspective-origin: center;
        }

        .panel {
        border-radius: 5px;
        width: 250px;
        height: 140px;
        position: absolute;
        background-size: cover;
            background-position: 50% 50%;	
        /* //box-shadow: 0 0 5px 3px #0006; */
        }

        .panel:nth-child(1) {
            transform: rotateY(0deg) translateZ(400px);
        }
        .panel:nth-child(2) {
            transform: rotateY(40deg) translateZ(400px);
        }
        .panel:nth-child(3) {
            transform: rotateY(80deg) translateZ(400px);
        }
        .panel:nth-child(4) {
            transform: rotateY(120deg) translateZ(400px);
        }
        .panel:nth-child(5) {
            transform: rotateY(160deg) translateZ(400px);
        }
        .panel:nth-child(6) {
            transform: rotateY(200deg) translateZ(400px);
        }
        .panel:nth-child(7) {
            transform: rotateY(240deg) translateZ(400px);
        }
        .panel:nth-child(8) {
            transform: rotateY(280deg) translateZ(400px);
        }
        .panel:nth-child(9){
            transform: rotateY(320deg) translateZ(400px);
        }
        
        .pagination {
        /* //background: #fff3; */
        width: 600px;
        height: 44px;
        margin-bottom: 60px;
        text-align: center;
        }
        .pagination button {
        padding: 0;
        border: none;
        cursor: pointer;
        width: 44px;
        color: black;
        background: #fffa;
        height: 44px;
        margin: 0 10px;
        font-family: 'Roboto', sans-serif;
        font-size: 20px;
        border-radius: 100%;
        transition: all .2s ease-in-out;
        }

        .pagination button:hover {
        background: #fffc;
        }

        .pagination button:active {
        background: #ffff;
        }

        @keyframes spin {
        0%{
            transform: rotateY(0deg);
        }
        50% {
            /* //nothing here; */
        }
        100%{
            transform: rotateY(360deg);
        }
        }

        .fade {
        background: #0006;
        background: linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.4) 30%, rgba(0,0,0,0.4) 70%, rgba(0,0,0,0) 100%);
        width: 100%;
        position: absolute;
        transform: rotateY(calc(var(--ang) * -1deg)) translateZ(110px);
        transition: all .5s ease-in-out;  
        }


        /* // pics */

        .a {
        background-image: url("Portfolio pages/agni/PORTFOLIO-37.png");
        }.b {
        background-image: url("Portfolio pages/bike/PORTFOLIO-30.png");
        }.c {
        background-image: url("Portfolio pages/can/PORTFOLIO-19.png");
        }.d {
        background-image: url("Portfolio pages/cat/PORTFOLIO-04.png");
        }.e {
        background-image: url("Portfolio pages/dadi/PORTFOLIO-14.png");
        }.f {
        background-image: url("Portfolio pages/grocery/PORTFOLIO-42.png");
        }.g {
        background-image: url("Portfolio pages/med/PORTFOLIO-69.png");
        }.h {
        background-image: url("Portfolio pages/wealth/PORTFOLIO-55.png");
        }.i {
        background-image: url("Portfolio pages/cosmo/PORTFOLIO-28.png");
        }


        *{
            margin: 0;
            padding: 0;
            --ang: 0;
        }
        .img1{
            width: 100%;
        }
    </style>
</body>
</html>
